[package]
name = "keel-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Keel attribute macros: #[keel::api], error, store, port, query, mutation"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["visit-mut"] }
quote.workspace = true
proc-macro2.workspace = true

[dev-dependencies]
prettyplease.workspace = true
trybuild.workspace = true
# The tests run the macros against a small stand-in for the `keel` facade
# (`tests/facade`), named `keel` so the default `::keel` root of generated code
# resolves. When keel-runtime and keel-signals land, point `keel` at
# `../keel` instead and un-ignore `tests/ui_runtime.rs`.
keel = { package = "keel-test-facade", path = "tests/facade" }
