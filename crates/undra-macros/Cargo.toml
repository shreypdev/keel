[package]
name = "undra-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Undra attribute macros: #[undra::api], error, store, port, query, mutation"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["visit-mut"] }
quote.workspace = true
proc-macro2.workspace = true

[dev-dependencies]
prettyplease.workspace = true
trybuild.workspace = true
# Generated code names `::undra::{wire, meta, runtime, signals, query}`; the tests run it
# against the real facade, so what the macros emit is checked against the real runtime.
undra = { workspace = true }
