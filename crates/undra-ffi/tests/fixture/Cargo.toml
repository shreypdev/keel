# A real Undra core for the boundary end-to-end runs: the same code as `tests/common/core.rs`
# built as a cdylib/staticlib on top of undra-ffi. It is its own workspace, so it never enters
# `cargo build --workspace`.
#
#   cargo build --manifest-path crates/undra-ffi/tests/fixture/Cargo.toml --target wasm32-unknown-unknown
#   cargo build --manifest-path crates/undra-ffi/tests/fixture/Cargo.toml            # libundra_fixture.{dylib,a} for the C, Swift and Kotlin tests
#
# Its namespace is `undra_fixture` (ADR-044): the library exports `undra_fixture_undra_api` and, with
# the `jni` feature, `JNI_OnLoad` registering on `dev.undra.fixture.UndraCoreNative`.
[package]
name = "undra-ffi-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "undra_fixture"
crate-type = ["cdylib", "staticlib"]

[dependencies]
undra = { path = "../../../undra" }
undra-ffi = { path = "../..", features = [] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
undra-ffi = { path = "../..", features = ["jni"] }

[workspace]

# Match the workspace: native builds unwind (constitution R6: a panic becomes a status 2 reply);
# only the wasm profile aborts (SPEC 7).
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
