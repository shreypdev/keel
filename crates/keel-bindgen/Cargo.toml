[package]
name = "keel-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Keel bindgen: emits idiomatic Swift, Kotlin and TypeScript bindings from a keel-meta schema"
readme = "README.md"

[dependencies]
keel-meta = { workspace = true }
serde_json = { workspace = true }
heck = { workspace = true }

[dev-dependencies]
