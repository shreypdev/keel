# CI for demo, written by `undra init`: the core, and one job per app (ios, android, web).
#
# UNDRA_VERSION is the Undra release this project builds with: CI installs that `undra` (the install script
# of docs/RELEASING.md) and `undra upgrade` keeps this line in step with core/Cargo.toml and the runtimes.
# Until that release is published the install step fails: change it to a published version or remove the
# job that needs it.
name: Undra

env:
  UNDRA_VERSION: "0.0.9"
  CARGO_TERM_COLOR: always

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core (fmt, clippy, test, bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install undra
        run: |
          curl -fsSL https://shreypdev.github.io/undra/install.sh | sh
          echo "$HOME/.undra/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: The generated bindings are up to date
        run: undra bindgen --check

  ios:
    name: iOS (xcodebuild)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # The generated project needs Xcode 16 or newer.
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install undra
        run: |
          curl -fsSL https://shreypdev.github.io/undra/install.sh | sh
          echo "$HOME/.undra/bin" >> "$GITHUB_PATH"
      - name: Build (the "Build the Undra core" Xcode phase builds the core first)
        env:
          # The Swift runtime package ships link-time stand-ins for the core; this switches them off.
          UNDRA_LINK_CORE: "1"
        run: >
          xcodebuild
          -project ios/Demo.xcodeproj
          -scheme Demo
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Set up the Android NDK r27 and cargo-ndk
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Install undra
        run: |
          curl -fsSL https://shreypdev.github.io/undra/install.sh | sh
          echo "$HOME/.undra/bin" >> "$GITHUB_PATH"
      - name: Build (the undraBuild Gradle task builds the core first)
        working-directory: android
        run: ./gradlew assembleDebug

  web:
    name: Web (install, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install undra
        run: |
          curl -fsSL https://shreypdev.github.io/undra/install.sh | sh
          echo "$HOME/.undra/bin" >> "$GITHUB_PATH"
      - name: Install the web app's dependencies
        working-directory: web
        # `npm ci` needs web/package-lock.json: run `npm install` once in web/ and commit the file.
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test
        working-directory: web
        run: npm test --if-present
      - name: Build (the undra() Vite plugin builds the core first)
        working-directory: web
        run: npm run build
