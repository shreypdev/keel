
  web:
    name: Web (install, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
@@INSTALL_UNDRA@@      - name: Install the web app's dependencies
        working-directory: web
        # `npm ci` needs web/package-lock.json: run `npm install` once in web/ and commit the file.
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test
        working-directory: web
        run: npm test --if-present
      - name: Build (the undra() Vite plugin builds the core first)
        working-directory: web
        run: npm run build
      # The web build always writes the symbol files of the core (ADR-046): the debug module with DWARF and names, and
      # the function map that names every `wasm-function[i]` of a production stack trace. Keep them with the build;
      # `undra symbolicate report.json --symbols <the unpacked artifact>` resolves a report by hand, and Sentry takes
      # the debug module as a debug file.
      - name: Upload the symbol files
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: @@NAMESPACE@@-web-symbols
          path: build/symbols/
          if-no-files-found: error
