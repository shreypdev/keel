[package]
name = "undra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Undra: write app logic once in Rust, get native Swift, Kotlin and TypeScript APIs. The facade crate users depend on."
readme = "README.md"
keywords = ["undra", "cross-platform", "ios", "android", "wasm"]
categories = ["development-tools::ffi", "asynchronous"]

[dependencies]
undra-macros = { workspace = true }
undra-meta = { workspace = true }
undra-wire = { workspace = true }
undra-signals = { workspace = true }
undra-runtime = { workspace = true }
undra-query = { workspace = true }
undra-ports = { workspace = true }
undra-testkit = { workspace = true }

# The opt-in standard ports (ADR-047, ADR-048), off by default: `undra = { features = ["websocket"] }`.
[features]
# The opt-in leaf types (ADR-042): types of popular crates that cross as the wire type they stand for.
# Each dependency is built with `default-features = false`, so no clock and no randomness comes with
# it (R12), and each builds for wasm32-unknown-unknown, iOS and Android (`.github/workflows/ci.yml`).
# Each feature is also forwarded to `undra-macros`, which needs to know it to name the missing
# feature when a type of one of these crates is spelled without it.
#
# `uuid::Uuid` crosses as `Uuid` (16 bytes).
uuid = ["undra-wire/uuid", "undra-macros/uuid"]
# `chrono::DateTime<Utc>` crosses as `Timestamp` (milliseconds since the epoch, truncated toward
# negative infinity) and `chrono::TimeDelta` as `Duration` (nanoseconds; a negative one encodes as zero).
chrono = ["undra-wire/chrono", "undra-macros/chrono"]
# `time::OffsetDateTime` and `time::UtcDateTime` cross as `Timestamp` (normalised to UTC, milliseconds,
# truncated toward negative infinity) and `time::Duration` as `Duration` (a negative one encodes as zero).
time = ["undra-wire/time", "undra-macros/time"]
# `rust_decimal::Decimal` crosses as `Decimal` (96-bit mantissa, scale up to 28: always encodes; a wire
# value outside that range decodes to an error).
rust_decimal = ["undra-wire/rust_decimal", "undra-macros/rust_decimal"]
# `bytes::Bytes` crosses as `Bytes`.
bytes = ["undra-wire/bytes", "undra-macros/bytes"]

# The `WebSocket` port (`undra::ports::ws`).
websocket = ["undra-ports/websocket"]
# The `Sse` port (`undra::ports::sse`).
sse = ["undra-ports/sse"]
# The `Db` port over SQLite (`undra::ports::db`).
db = ["undra-ports/db"]
# `undra::ports::fakes::MemDb`, a real in-memory SQLite behind the `Db` port, for a core's tests:
# enable it in `[dev-dependencies]` only (it does not build for wasm32-unknown-unknown).
db-fake = ["undra-ports/db-fake"]

[dev-dependencies]
undra-bindgen = { workspace = true }
