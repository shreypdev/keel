# Generated by `keel`: do not edit, it is rewritten whenever the project changes.
#
# This is the library that ships to the platforms: the app core and the Keel C ABI (`keel-ffi`)
# linked into one `keel_core` library. `keel build` compiles it as a cdylib (Android, the host,
# the web) or a staticlib (iOS); `keel bindgen` loads the host build to read the schema.
[package]
name = "keel-core-shim"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
# Per-project so a shared target directory never collides on one artifact (keel-ffi's test
# fixture builds a `keel_core` of its own); `keel build` copies the output to its canonical
# `libkeel_core.*` name, which is what the Kotlin runtime loads.
name = "@@SHIM_LIB_NAME@@"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
keel-ffi = @@KEEL_FFI@@
app-core = { path = @@CORE_DIR@@, package = @@CORE_PACKAGE@@ }

[features]
# The JNI shim (Kotlin / Android, and the JVM on the host).
jni = ["keel-ffi/jni"]

# The dev profile is not incremental. This library is *loaded* by the platform runtimes with no
# link-time reference to it (a dev `keel build --platform host`, `keel bindgen`'s dlopen, the Kotlin
# runtime's `System.loadLibrary`), and the app core and keel-ffi are dependency rlibs, not this
# crate's root module. rustc links rlibs with `--start-lib` (lazy) semantics, so the macOS linker
# keeps only the objects something references -- and nothing references the core's `#[keel::api]`/
# store/port/error `inventory::submit!` statics (the schema, SPEC 2.4) or keel-ffi's `#[no_mangle]`
# JNI exports (`JNI_OnLoad`, `Java_dev_keel_runtime_KeelNative_*`, SPEC 6.1). An *incremental* build
# partitions those rlibs into many tiny codegen units, and the macOS linker drops the unreferenced
# ones: the core then reports the empty schema (hash 0x98754cbea76a32b2) and `System.loadLibrary`
# cannot bind its natives (no `-force_load`/`-all_load` overrides `--start-lib`). A non-incremental
# build keeps them -- the same reason the release profile and the iOS staticlib (`-force_load`) never
# showed this (ADR-029). `keel build` compiles the host library in a target directory of its own so a
# plain `cargo build`/`cargo test` cannot leave a stripping-prone rlib for it to reuse
# (`crate::shim::host_lib_target_dir`). `keel dev` is unaffected: it serves the core from the dev
# *runner*, an executable, whose constructors always run.
[profile.dev]
incremental = false

# The profiles match the workspace's (docs/SPEC.md 7): a panic on native targets must unwind so
# the boundary can report it (constitution R6); only wasm aborts.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
strip = "symbols"
debug = false

[profile.release-wasm]
inherits = "release"
opt-level = "@@WASM_OPT_LEVEL@@"
panic = "abort"

[workspace]
