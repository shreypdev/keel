[package]
name = "undra-ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Undra standard ports: Clock, Rng, Log, Http, Kv, SecureStore, Fs, Timer, Connectivity, Lifecycle (and, opt-in, WebSocket, Sse, Db), their records, and deterministic fakes"
readme = "README.md"
keywords = ["undra", "ports", "testing", "fakes", "cross-platform"]
categories = ["development-tools::testing", "asynchronous"]

[dependencies]
undra-macros = { workspace = true }
undra-meta = { workspace = true }
undra-wire = { workspace = true }
undra-runtime = { workspace = true }
parking_lot = { workspace = true }
futures-core = { workspace = true }
# Only behind the dev-only feature `db-fake` (`fakes::MemDb`, a real in-memory SQLite). Never enabled by
# a shipped build: `undra`'s default and `db` features do not reach it (tests/opt_in.rs checks), and
# it does not build for wasm32-unknown-unknown, which is why it may only ever be a dev-dependency.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

# Opt-in standard ports (ADR-047, ADR-048). Off by default: a core that does not ask for them has the
# schema, the schema hash and the wasm it had before they existed.
[features]
# The `WebSocket` port, its records and `FakeWebSocket`.
websocket = []
# The `Sse` (server-sent events) port, its records and `FakeSse`.
sse = []
# The `Db` port (SQLite), its records and `FakeDb`.
db = []
# `fakes::MemDb`: the `Db` port over a real in-memory SQLite (rusqlite, bundled). For tests and
# benchmarks only: enable it in `[dev-dependencies]`, never in a core's `[dependencies]`.
db-fake = ["db", "dep:rusqlite"]

[dev-dependencies]
proptest = { workspace = true }
# Only to prove the standard schema generates Swift, Kotlin and TypeScript (tests/schema.rs).
undra-bindgen = { workspace = true }
