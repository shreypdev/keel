[package]
name = "undra-ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Undra standard ports: Clock, Rng, Log, Http, Kv, SecureStore, Fs, Timer, Connectivity, Lifecycle (and, opt-in, WebSocket, Sse, Db), their records, and deterministic fakes"
readme = "README.md"
keywords = ["undra", "ports", "testing", "fakes", "cross-platform"]
categories = ["development-tools::testing", "asynchronous"]

[dependencies]
undra-macros = { workspace = true }
undra-meta = { workspace = true }
undra-wire = { workspace = true }
undra-runtime = { workspace = true }
parking_lot = { workspace = true }
futures-core = { workspace = true }

# Opt-in standard ports (ADR-047, ADR-048). Off by default: a core that does not ask for them has the
# schema, the schema hash and the wasm it had before they existed.
[features]
# The `WebSocket` port, its records and `FakeWebSocket`.
websocket = []
# The `Sse` (server-sent events) port, its records and `FakeSse`.
sse = []
# The `Db` port (SQLite), its records and `FakeDb`.
db = []

[dev-dependencies]
proptest = { workspace = true }
# Only to prove the standard schema generates Swift, Kotlin and TypeScript (tests/schema.rs).
undra-bindgen = { workspace = true }
