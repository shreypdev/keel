[package]
name = "undra-bench"
version.workspace = true
edition.workspace = true
publish = false
description = "Undra's benchmark harness: criterion benches for humans, the budgets test for CI (constitution R9)."

[dependencies]
undra = { workspace = true }
undra-ports = { workspace = true }
undra-query = { workspace = true }
undra-runtime = { workspace = true }
undra-wire = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }

# Every bench target is listed: with one explicit `[[bench]]`, cargo would otherwise pick up the
# rest of `benches/` with the default (libtest) harness.
[[bench]]
name = "query"
harness = false

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "signals"
harness = false

[[bench]]
name = "snapshot"
harness = false
