# ---------------------------------------------------------------------------------------------
# Ratios between two layer A rows of the same run (bench review M1). Rule in the header. The
# healthy samples behind each `max` are the reference host (budgets.toml's measured_ns, and a quiet
# run) and the twelve runner runs; `measured` is the quiet host. An operation that is `*_x1000`
# runs 1,000 operations per iteration, hence the `_div`.
# ---------------------------------------------------------------------------------------------

# What a transaction commit (an update, the change-set, delivery to a counting host) costs against
# a bare method call that writes nothing: `Calculator.add` through `call_sync`. The tightest gate
# here: healthy 1.24-1.94 on every sample, 3.1 on the reference host with the commit path made 1.8x
# slower on purpose (bench/RESULTS.md, "Gates that catch a 2x regression"), 2.3 maximum.
[ratio."commit_vs_bare_call"]
num = "stress/firehose/txn_x1000"
num_div = 1000
den = "dispatch/call_sync/add"
max = 2.3
measured = 1.75

# The same relationship through the host-facing path: `Ticker.set` through `call_sync` (decode,
# dispatch, write, commit, delivery, reply) against the bare call. Healthy 2.25-3.05; 5.1 with the
# commit 1.8x slower on the reference host.
[ratio."set_vs_bare_call"]
num = "stress/firehose/call_set"
den = "dispatch/call_sync/add"
max = 3.6
measured = 3.05

# An event through `Runtime::event` costs about what a call does: both end in the same commit.
# Healthy 0.76-0.93. Catches the event path alone getting costlier.
[ratio."event_vs_set"]
num = "stress/firehose/event"
den = "stress/firehose/call_set"
max = 1.1
measured = 0.85

# Commit cost follows the dirty count, not the observed count (the layer B scenario asserts the same
# on its sustained run, at 4x). Cache-bound, so it is the one ratio whose spread across hardware is
# as wide as what it could see: healthy 0.99-2.37 over twelve runner runs. Its first maximum, 2.3
# (1.15x the six runs it was set from), failed a docs-only commit at 2.37 on the very next class of
# runner (36806665630). The bound is now what it guards: commit cost following the observed count
# would put this near 10 (100,000 against 10,000 observed), so 4, the scenario's own bound, sees it
# on every runner, and no cache size seen so far comes near it.
[ratio."fanout_100k_vs_10k_observed"]
num = "stress/fanout/100k_observed_1k_dirty"
den = "stress/fanout/10k_observed_1k_dirty"
max = 4
measured = 1.22

# One recorded list operation on 10,000 rows (commit, delivery, host apply) against a scalar write
# through a call: how much a keyed-list patch costs relative to a signal. Healthy 15-47: this is the
# widest ratio (a memmove-bound operation against an atomics-bound one: the runner runs the list
# 1.2x slower than the host and the call 3x slower), so it guards the host and catches an
# order-of-magnitude shift (an O(list) path coming back) on a runner, not a 2x one.
[ratio."keyed_churn_vs_set"]
num = "stress/keyed_churn_10k/ops_x1000"
num_div = 1000
den = "stress/firehose/call_set"
max = 54
measured = 39.5
