# The diff itself (`KeyedPatch::diff`) is O(list) by nature: hashing both lists, then the order
# analysis. Since ADR-027 it is the fallback for lists written with `set` / `update` / `replace`,
# not the path of the recorded list operations (see the `signals/keyed_10k/*` rows below).
[bench."wire/keyed_patch_10k/diff"]
budget_ns = 2200000
measured_ns = 435333.5

[bench."wire/keyed_patch_10k/roundtrip"]
budget_ns = 650
measured_ns = 128.4

[bench."wire/keyed_patch_10k/apply"]
budget_ns = 12000
measured_ns = 2333.0

# `call_sync/*` are `Runtime::call_sync`, which returns a `Vec` (one allocation: what `undra_call_sync`
# hands the host as an `UndraBuf`); `call_sync_with/add` lends the reply buffer and allocates nothing
# (ADR-028). The floor applies to the first two: 5x their measurements is under 250 ns. The
# allocation count itself is guarded exactly by `crates/undra-ffi/tests/sync_alloc.rs`.
[bench."dispatch/call_sync/add"]
budget_ns = 250
measured_ns = 42.9
blueprint_ns = 60
blueprint = "Handle method call, primitive args and return: <= 60 ns iOS (A15), <= 250 ns Android, <= 80 ns web"

[bench."dispatch/call_sync_with/add"]
budget_ns = 250
measured_ns = 31.8

[bench."dispatch/call_sync/function"]
budget_ns = 250
measured_ns = 36.0

