budget_ns = 720
measured_ns = 142.1
blueprint_ns = 3000
blueprint = "1 KB record, round trip: <= 3 us iOS (A15), <= 8 us Android, <= 4 us web (core half of the call here)"

[bench."dispatch/call_async/ready_add"]
