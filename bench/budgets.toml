# Keyed lists written with the recorded list operations (`Signal<Vec<T>>::insert`, `update_at`,
# `move_item`, ADR-027): the patch is the op log, O(ops) and not O(list). What is left of the 10,000-row
# cost is the `memmove` of the vector's tail (in the core's list and in the baseline), 0.6 ns per row.
# `signals/keyed_10k/insert` is the blueprint section 14 row and now meets it on this host.
[bench."signals/keyed_10k/insert"]
budget_ns = 31000
measured_ns = 6125.0
blueprint_ns = 20000
blueprint = "Keyed patch on 10,000 items, one insert: <= 20 us iOS (A15), <= 40 us Android, <= 30 us web"

[bench."signals/keyed_10k/update"]
budget_ns = 1400
measured_ns = 277.4

[bench."signals/keyed_10k/move"]
budget_ns = 48000
measured_ns = 9523.1

# The fallback: the same one-row edit through the raw `Signal::update`, which the commit finds by
# diffing the list against what the host has. Patches are computed by diffing the whole list, so this
# is O(list), not O(change): it guards the fallback path at about its old cost (the row was
# `signals/keyed_10k/update` before ADR-027, budget 2,700,000 ns).
[bench."signals/keyed_10k/raw_update_diff"]
budget_ns = 2700000
measured_ns = 525542.0

[bench."signals/keyed_1k/insert"]
budget_ns = 3200
