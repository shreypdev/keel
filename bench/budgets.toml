# Host budgets for the budgets test (`cargo test -p undra-bench --test budgets --release`).
#
# WHAT THESE ARE. Regression guards for a host machine, not the blueprint's device targets
# (docs/blueprint.html section 14 is per device: A15 iPhone, mid-range 2022 Android, Chromium;
# those are measured on devices in the playground phase, see bench/RESULTS.md). A budget here
# fails CI when an operation became several times slower than it was.
#
# HOW THEY WERE SET. `measured_ns` is the p50 the budgets test itself reported on an Apple M5 Pro
# (macOS 26.5, rustc 1.98.1, release profile: LTO fat, codegen-units 1): the best of three runs,
# because the machine was shared with other builds and the best run is the closest to an
# unloaded number. It agrees with the criterion median within a few percent. The budget is 5x
# that, with an absolute floor of 250 ns (the noise floor of a shared runner for operations that
# take tens of nanoseconds), rounded up to two significant figures.
#
# WHY 5x. A shared ubuntu-latest runner is commonly 1.5-3x slower than an M-series laptop and
# noisier; the test also takes the best of three attempts. 5x passes on such a runner and still
# fails a change that makes an operation 5x slower, which is the size of regression that
# matters (an accidental O(n) on a hot path, a lock taken per call, a copy per item). A smaller
# regression is what criterion's before/after comparison is for. If CI proves consistently
# slower, set UNDRA_BENCH_SCALE in the workflow instead of loosening this file.
#
# `blueprint_ns` / `blueprint` record the section 14 row an operation relates to, so the
# report prints how far this host is from the device target. Where the host is already over the
# target (see "Findings" in bench/RESULTS.md), the budget here still only guards the regression:
# fixing the operation, not the budget, is what closes the gap.
#
# To set or re-base a budget: `cargo test -p undra-bench --test budgets --release -- --ignored
# --nocapture baseline`, then apply the rule above.
#
# HARSH CONDITIONS (layer B). The `[stress."name"]` tables at the end gate the sustained scenarios
# of `cargo test -p undra-bench --test stress --release` (and, for `soak/mixed`, the soak binary):
# what the core does at rates far above any UI, for seconds at a time. Same machine, same best-of-
# three rule, measured with UNDRA_STRESS_SECONDS=10; each scenario's invariants (nothing lost,
# nothing reordered, the host list equals the core list, a stream never more than one item ahead)
# are asserted in code and are not negotiable. The rules:
#   min_per_sec     measured throughput / 5, rounded DOWN to two significant figures
#   p99_ns          5x the measured p99, rounded up to two significant figures
#   p999_ns         10x the measured p999, rounded up (tails on a shared runner are noisier)
#   bytes_per_op    change-set bytes per operation, at most this: the exact measured value, because
#                   every load is a fixed cycle at fixed widths and so ships the same bytes each run
#   rss_growth_pct  resident memory may grow by this percent (or 64 KiB) from the first sample after
#                   the warm-up to the last
# UNDRA_BENCH_SCALE divides the floors and multiplies the ceilings; it never touches bytes, RSS or
# the invariants. These are the CORE SIDE of the pipeline on a host; what a platform does with a
# change-set afterwards is measured on the platform (bench/RESULTS.md, "Harsh conditions").
# To set or re-base: `UNDRA_STRESS_SECONDS=10 cargo test -p undra-bench --test stress --release --
# --ignored --nocapture stress_baseline`, best of three runs, then apply the rules above.

[meta]
machine = "Apple M5 Pro, 18 cores, macOS 26.5"
rustc = "1.98.1"
profile = "release (lto = fat, codegen-units = 1)"
factor = 5
floor_ns = 250

