			shellScript = "# Builds the Undra core (`undra build --platform ios`) before Compile Sources, so the app never needs a manual build step.\n# Xcode skips this phase while the files in Config/undra-core-inputs.xcfilelist are older than the ones in\n# Config/undra-core-outputs.xcfilelist (the XCFramework and a stamp for the configuration being built).\nexport PATH=\"$HOME/.undra/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH\"\nif ! command -v undra >/dev/null 2>&1; then\n  echo \"error: [undra::C0003] 'undra' was not found. This build phase runs 'undra build --platform ios' to compile the Rust core, and it is not on PATH or in ~/.undra/bin, ~/.cargo/bin or Homebrew's directories. Install it with: curl -fsSL https://shreypdev.github.io/undra/install.sh | sh  then build again; 'undra doctor' checks the rest of the toolchain. docs: https://shreypdev.github.io/undra/docs/errors.html#C0003\"\n  exit 1\nfi\necho \"note: undra build --platform ios --configuration $CONFIGURATION\"\n# Xcode's build environment (SDKROOT, CC, ARCHS, ...) says how to compile the app and breaks the toolchain lookups of\n# Cargo, so `undra` gets a clean one that keeps only what it needs.\nexec env -i HOME=\"$HOME\" USER=\"$USER\" LANG=\"${LANG:-en_US.UTF-8}\" TMPDIR=\"${TMPDIR:-/tmp}\" PATH=\"$PATH\" ${DEVELOPER_DIR:+\"DEVELOPER_DIR=$DEVELOPER_DIR\"} ${CARGO_HOME:+\"CARGO_HOME=$CARGO_HOME\"} ${RUSTUP_HOME:+\"RUSTUP_HOME=$RUSTUP_HOME\"} ${CARGO_TARGET_DIR:+\"CARGO_TARGET_DIR=$CARGO_TARGET_DIR\"} undra -C \"$SRCROOT/..\" build --platform ios --configuration \"$CONFIGURATION\"\n";
