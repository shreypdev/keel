[package]
name = "playground-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The Undra playground core: one Rust core shared by the web, iOS and Android playground apps and by the contract tests."

# A plain library, like every Undra core: `undra build` links it with the C ABI into the library each
# platform loads, and `undra dev` serves it over a WebSocket (see ../undra.toml).
[features]
# Build B of the migration scenarios (ADR-037; `src/updates.rs`). The contract runners build it
# through `undra build` with `UNDRA_PLAYGROUND_V2=1`, which `build.rs` turns into the same cfg.
migration-v2 = []

[dependencies]
# The opt-in ports (ADR-047, ADR-048): `live` uses WebSocket and Sse, `notes` uses Db.
undra = { workspace = true, features = ["websocket", "sse", "db"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Tests only: `MemDb`, a real in-memory SQLite behind the Db port (never in a shipped build: it does not
# build for wasm32-unknown-unknown).
[dev-dependencies]
undra = { workspace = true, features = ["db-fake"] }
