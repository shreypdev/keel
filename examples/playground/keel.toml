# keel.toml: makes examples/playground a Keel project (`keel --help` for the commands).
#
# The playground is the reference app of Keel v1 (constitution R10: we ship on it first). One Rust
# core (core/) is the whole app logic; web/, ios/ and android/ are three UIs over the bindings
# `keel bindgen` generates from it (generated/), and ../../contract-tests runs the same core from
# all three platform runtimes.

[project]
name = "playground"
# The Android applicationId, the iOS bundle identifier and the base of the Kotlin package.
id = "dev.keel.playground"
platforms = ["ios", "android", "web"]

[core]
# The crate `keel bindgen`, `keel build` and `keel dev` work on.
path = "core"

[paths]
# Written by `keel bindgen` (Swift package, Gradle module, npm package). Committed, and checked
# in CI with `keel bindgen --check`.
generated = "generated"
# Written by `keel build` (XCFramework, jniLibs, wasm). Not committed.
build = "build"

[keel]
# The playground lives inside the Keel repository, so the crates and the three platform runtimes
# are used from this checkout.
version = "0.1"
path = "../.."

[bindings]
swift_module = "PlaygroundCore"
kotlin_package = "dev.keel.playground.core"
ts_scope = "playground"
ts_package = "core"

[ios]
deployment_target = "17.0"
simulator_archs = ["arm64"]

[android]
abis = ["arm64-v8a", "x86_64"]
min_sdk = 26

[web]
opt_level = "z"
