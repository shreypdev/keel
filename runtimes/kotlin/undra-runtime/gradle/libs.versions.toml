[versions]
kotlin = "2.0.21"
# Pinned to the version shipped inside the Gradle 8.14 distribution so that `scripts/test-local.sh`
# (which compiles against that jar) and the Gradle build see the same API.
coroutines = "1.6.4"
junit = "5.10.3"
# The Android Gradle Plugin of :android-adapters; the same as the playground app's (examples/playground/android).
agp = "8.7.3"
# Test-only dependencies of :android-adapters (never shipped): JUnit 4 for its JVM unit tests, AndroidX Test for the
# instrumented ones. The library itself has no dependency besides :runtime.
junit4 = "4.13.2"
androidx-test-runner = "1.6.2"
androidx-test-core = "1.6.1"
androidx-test-ext-junit = "1.2.1"
# The optional :android-work module (ADR-046): WorkManager runs the core's background tasks in a window the OS grants.
# 2.10 builds against API 35 and AGP 8.7, which is what this project's toolchain pins; a newer line may ask for more.
androidx-work = "2.10.5"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
