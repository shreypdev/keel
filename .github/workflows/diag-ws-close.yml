name: Diag WebSocket close

# TEMPORARY (ci-green): what does a client-initiated close do on the hosted macOS 15 runner? Removed before the branch lands.
on:
  push:
    branches: ["wt/ci-green"]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Versions
        run: |
          sw_vers
          node --version
          swift --version
          uname -a
      - name: Both servers, both clients, one VM
        continue-on-error: true
        run: |
          node contract-tests/servers/realtime-server.mjs --port 0 > "$RUNNER_TEMP/plain.out" 2>&1 &
          (sleep 900 | node contract-tests/servers/realtime-server.mjs --port 0 --exit-on-stdin-close > "$RUNNER_TEMP/flag.out" 2>&1) &
          sleep 2
          PLAIN="$(grep READY "$RUNNER_TEMP/plain.out" | cut -d' ' -f2)"
          FLAG="$(grep READY "$RUNNER_TEMP/flag.out" | cut -d' ' -f2)"
          echo "plain server $PLAIN, flag server $FLAG"
          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          import Foundation

          final class Delegate: NSObject, URLSessionWebSocketDelegate, @unchecked Sendable {
              var opened: CheckedContinuation<Void, Never>?
              func urlSession(_ session: URLSession, webSocketTask: URLSessionWebSocketTask, didOpenWithProtocol p: String?) { opened?.resume(); opened = nil }
          }
          let label = CommandLine.arguments[1]
          let port = CommandLine.arguments[2]
          for _ in 0..<4 {
              let d = Delegate()
              let session = URLSession(configuration: .default, delegate: d, delegateQueue: OperationQueue())
              let task = session.webSocketTask(with: URL(string: "ws://127.0.0.1:\(port)/ws/echo")!)
              task.maximumMessageSize = 16 * 1024 * 1024
              await withCheckedContinuation { (c: CheckedContinuation<Void, Never>) in d.opened = c; task.resume() }
              task.cancel(with: .normalClosure, reason: Data("done".utf8))
              session.finishTasksAndInvalidate()
              try? await Task.sleep(nanoseconds: 500_000_000)
          }
          print("standalone client done against \(label)")
          SWIFT
          swiftc -swift-version 5 -o "$RUNNER_TEMP/diag" "$RUNNER_TEMP/main.swift"
          for round in 1 2; do
            "$RUNNER_TEMP/diag" plain "$PLAIN"
            "$RUNNER_TEMP/diag" flag "$FLAG"
          done
          cd runtimes/swift/UndraRuntime
          UNDRA_DIAG_PORT="$PLAIN" swift test --filter DiagRawTests 2>&1 | grep -E "DIAGRAW echo=false" | head -3
          UNDRA_DIAG_PORT="$FLAG" swift test --filter DiagRawTests 2>&1 | grep -E "DIAGRAW echo=false" | head -3
          cd ../../..
          echo "---- plain server's view (frames received / socket ends):"
          grep -cE "opcode=8" "$RUNNER_TEMP/plain.out" || true
          grep -cE "socket end" "$RUNNER_TEMP/plain.out" || true
          echo "---- flag server's view:"
          grep -cE "opcode=8" "$RUNNER_TEMP/flag.out" || true
          grep -cE "socket end" "$RUNNER_TEMP/flag.out" || true
          echo "---- plain server log:"; grep -E "upgrade|opcode=8|socket (end|close)" "$RUNNER_TEMP/plain.out" | head -40
          echo "---- flag server log:"; grep -E "upgrade|opcode=8|socket (end|close)" "$RUNNER_TEMP/flag.out" | head -40
