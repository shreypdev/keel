name: Diag WebSocket close

# TEMPORARY (ci-green): what does a client-initiated close do on the hosted macOS 15 runner? Removed before the branch lands.
on:
  push:
    branches: ["wt/ci-green"]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Versions
        run: |
          sw_vers
          node --version
          swift --version
          uname -a
      - name: Close timing on the standalone client
        continue-on-error: true
        run: |
          node contract-tests/servers/realtime-server.mjs --port 0 > "$RUNNER_TEMP/server.out" 2>&1 &
          sleep 2
          PORT="$(grep READY "$RUNNER_TEMP/server.out" | cut -d' ' -f2)"
          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          import Foundation

          final class Delegate: NSObject, URLSessionWebSocketDelegate, @unchecked Sendable {
              var opened: CheckedContinuation<Void, Never>?
              func urlSession(_ session: URLSession, webSocketTask: URLSessionWebSocketTask, didOpenWithProtocol p: String?) { opened?.resume(); opened = nil }
          }

          func record(_ port: String) async -> (code: String, closed: String) {
              var req = URLRequest(url: URL(string: "http://127.0.0.1:\(port)/stats")!)
              req.cachePolicy = .reloadIgnoringLocalCacheData
              guard let (d, _) = try? await URLSession.shared.data(for: req),
                    let j = try? JSONSerialization.jsonObject(with: d) as? [String: Any],
                    let cs = j["connections"] as? [[String: Any]],
                    let last = cs.last(where: { ($0["path"] as? String) == "/ws/echo" }) else { return ("?", "?") }
              return ("\(last["closeCode"] ?? "nil")", "\(last["clientClosed"] ?? "?")")
          }

          func trial(_ port: String, echo: Bool, delayMs: Int, ping: Bool, pendingReceive: Bool) async -> String {
              let d = Delegate()
              let session = URLSession(configuration: .default, delegate: d, delegateQueue: OperationQueue())
              let task = session.webSocketTask(with: URL(string: "ws://127.0.0.1:\(port)/ws/echo")!)
              task.maximumMessageSize = 16 * 1024 * 1024
              await withCheckedContinuation { (c: CheckedContinuation<Void, Never>) in d.opened = c; task.resume() }
              if echo { try? await task.send(.string("hello")); _ = try? await task.receive() }
              if pendingReceive { Task { _ = try? await task.receive() } }
              if ping {
                  await withCheckedContinuation { (c: CheckedContinuation<Void, Never>) in task.sendPing { _ in c.resume() } }
              }
              if delayMs > 0 { try? await Task.sleep(nanoseconds: UInt64(delayMs) * 1_000_000) }
              task.cancel(with: .normalClosure, reason: Data("done".utf8))
              session.finishTasksAndInvalidate()
              try? await Task.sleep(nanoseconds: 700_000_000)
              let r = await record(port)
              return "closeCode=\(r.code) clientClosed=\(r.closed)"
          }

          let port = CommandLine.arguments[1]
          for echo in [false, true] {
              for pendingReceive in [false, true] {
                  for delay in [0, 2, 10, 50] {
                      var out: [String] = []
                      for _ in 0..<3 { out.append(await trial(port, echo: echo, delayMs: delay, ping: false, pendingReceive: pendingReceive)) }
                      print("echo=\(echo) pendingReceive=\(pendingReceive) delay=\(delay)ms: " + out.joined(separator: " | "))
                  }
              }
          }
          var out: [String] = []
          for _ in 0..<3 { out.append(await trial(port, echo: true, delayMs: 0, ping: true, pendingReceive: true)) }
          print("echo=true pendingReceive=true ping-pong first, delay=0: " + out.joined(separator: " | "))
          SWIFT
          swiftc -swift-version 5 -o "$RUNNER_TEMP/diag" "$RUNNER_TEMP/main.swift"
          "$RUNNER_TEMP/diag" "$PORT"
