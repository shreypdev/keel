name: Diag WebSocket close

# TEMPORARY (ci-green): what does a client-initiated close do on the hosted macOS 15 runner? Removed before the branch lands.
on:
  push:
    branches: ["wt/ci-green"]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hardware
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true
          uname -a
      - name: The echo test with each variant of the adapter's close
        working-directory: runtimes/swift/UndraRuntime
        run: |
          swift build --build-tests 2>&1 | tail -1
          for v in base delayinv predelay ping pingdelayinv; do
            for t in testEchoTextAndBinaryAndAClientClose testAConnectionTheCoreLetsGoIsClosedGoingAway; do
              if UNDRA_WS_VARIANT=$v swift test --skip-build --filter URLSessionWebSocketAdapterTests/$t > "$RUNNER_TEMP/out.txt" 2>&1; then echo "VARIANT $v $t: PASS"; else echo "VARIANT $v $t: FAIL"; fi
            done
          done
