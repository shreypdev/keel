name: Diag WebSocket close

# TEMPORARY (ci-green): what does a client-initiated close do on the hosted macOS 15 runner? Removed before the branch lands.
on:
  push:
    branches: ["wt/ci-green"]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Versions
        run: |
          sw_vers
          node --version
          swift --version
          uname -a
      - name: R1 - XCTest raw trials against a server started by the shell (no stdin pipe, no flag)
        continue-on-error: true
        working-directory: runtimes/swift/UndraRuntime
        run: |
          node ../../../contract-tests/servers/realtime-server.mjs --port 0 > "$RUNNER_TEMP/s1.out" 2>&1 &
          sleep 2
          export UNDRA_DIAG_PORT="$(grep READY "$RUNNER_TEMP/s1.out" | cut -d' ' -f2)"
          swift test --filter DiagRawTests 2>&1 | grep -E "DIAGRAW|error:|Executed 1 test" | cut -c1-200 | head -20
          grep -E "upgrade|opcode=8|socket (end|close)" "$RUNNER_TEMP/s1.out" | head -12
      - name: R2 - the standalone client against a server with the harness's launch (a stdin pipe, --exit-on-stdin-close)
        continue-on-error: true
        run: |
          (sleep 600 | node contract-tests/servers/realtime-server.mjs --port 0 --exit-on-stdin-close > "$RUNNER_TEMP/s2.out" 2>&1) &
          sleep 2
          PORT="$(grep READY "$RUNNER_TEMP/s2.out" | cut -d' ' -f2)"
          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          import Foundation

          final class Delegate: NSObject, URLSessionWebSocketDelegate, @unchecked Sendable {
              var opened: CheckedContinuation<Void, Never>?
              func urlSession(_ session: URLSession, webSocketTask: URLSessionWebSocketTask, didOpenWithProtocol p: String?) { opened?.resume(); opened = nil }
          }
          let port = CommandLine.arguments[1]
          for echo in [false, true] {
              for _ in 0..<3 {
                  let d = Delegate()
                  let session = URLSession(configuration: .default, delegate: d, delegateQueue: OperationQueue())
                  let task = session.webSocketTask(with: URL(string: "ws://127.0.0.1:\(port)/ws/echo")!)
                  task.maximumMessageSize = 16 * 1024 * 1024
                  await withCheckedContinuation { (c: CheckedContinuation<Void, Never>) in d.opened = c; task.resume() }
                  if echo { try? await task.send(.string("hello")); _ = try? await task.receive() }
                  task.cancel(with: .normalClosure, reason: Data("done".utf8))
                  session.finishTasksAndInvalidate()
                  try? await Task.sleep(nanoseconds: 600_000_000)
              }
          }
          SWIFT
          swiftc -swift-version 5 -o "$RUNNER_TEMP/diag" "$RUNNER_TEMP/main.swift"
          "$RUNNER_TEMP/diag" "$PORT"
          grep -E "upgrade|opcode=8|socket (end|close)" "$RUNNER_TEMP/s2.out" | head -20
