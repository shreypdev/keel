name: Diag WebSocket close

# TEMPORARY (ci-green): what does a client-initiated close do on the hosted macOS 15 runner? Removed before the branch lands.
on:
  push:
    branches: ["wt/ci-green"]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Versions
        run: |
          sw_vers
          node --version
          swift --version
          uname -a
      - name: Raw URLSession close trials inside XCTest, against the harness's own server
        continue-on-error: true
        working-directory: runtimes/swift/UndraRuntime
        run: swift test --filter DiagRawTests 2>&1 | grep -E "DIAGRAW|SRVDBG.*(upgrade|opcode=8|socket (end|close))|error:|Executed 1 test" | cut -c1-200 | head -60
