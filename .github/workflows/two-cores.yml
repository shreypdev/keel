name: Two cores

# ADR-044: two Undra cores in one process. examples/two-cores builds the playground core twice, under the
# namespaces playground_a and playground_b, and a test app per platform loads both side by side through their
# generated entries: a call and an observed change on each, independent statistics, the same default `Kv` key
# written through each core and read back as that core's own value (the default stores are per namespace, ADR-044
# amendment A), one shut down while the other keeps working. Each app prints `two-cores <platform>: ok ...` lines and its runner exits non-zero
# unless the last is `passed`. The same scenario, as S26, runs in the contract columns of ci.yml.
#
#   iOS simulator   examples/two-cores/ios/run.sh       two prelinked static cores in one app binary (Debug and Release)
#   Android         examples/two-cores/android/run.sh   two .so in one APK, each registering its own JNI class
#   JVM             examples/two-cores/jvm/run.sh       two host libraries in one JVM
#   Node            examples/two-cores/node/run.sh      two wasm modules in one process
#
# The Rust version is pinned like every other workflow (see the comment at the top of ci.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: two-cores-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018

jobs:
  ios:
    name: iOS simulator (Debug and Release cores)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: The newest stable Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|candidate|_rc' | sort -V | tail -n 1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: The undra CLI
        run: cargo build -p undra-cli
      - name: Debug cores (prelinked with -all_load)
        run: SIMULATOR="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+ Pro' || echo 'iPhone 16 Pro')" examples/two-cores/ios/run.sh
      - name: Release cores (fat LTO, prelinked with -u)
        run: CONFIGURATION=Release examples/two-cores/ios/run.sh

  android:
    name: Android emulator (API 34, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: The Android NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk
      - name: The undra CLI and both cores (before the emulator boots, so they do not compete for the cores)
        run: |
          cargo build -p undra-cli
          for ns in a b; do target/debug/undra build -C examples/two-cores/$ns --platform android --release; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, read the app's checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash examples/two-cores/android/run.sh

  jvm-and-node:
    name: JVM and Node
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install kotlinc and kotlinx-coroutines
        run: |
          curl -sSfL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/lib"
          curl -sSfLo "$HOME/lib/kotlinx-coroutines-core-jvm-1.6.4.jar" \
            https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.6.4/kotlinx-coroutines-core-jvm-1.6.4.jar
      - name: The undra CLI
        run: cargo build -p undra-cli
      - name: JVM
        env:
          UNDRA_KOTLINX_COROUTINES: /home/runner/lib/kotlinx-coroutines-core-jvm-1.6.4.jar
          UNDRA_KOTLIN_STDLIB: /home/runner/kotlin/kotlinc/lib/kotlin-stdlib.jar
        run: examples/two-cores/jvm/run.sh
      - name: Node
        run: examples/two-cores/node/run.sh
