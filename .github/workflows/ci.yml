name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Rust version is pinned, not "stable": the compile-fail goldens (trybuild) quote rustc's
# wording and the bench budgets are baselined on one compiler, so a new stable release must land
# as a deliberate commit that bumps every `rust-toolchain@` line here, in bench.yml, release.yml,
# rn-devices.yml and site.yml together, regenerates the goldens (TRYBUILD=overwrite) and re-baselines the
# budgets. 1.99.0 (2026-10-01) is the first one waiting: it renames `fetch_update`
# (already replaced by `cas_update`) and rewords const-eval panics.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TS runtime dev dependencies (the bindgen fixtures compile it with tsc)
        working-directory: runtimes/ts/@undra/runtime
        run: npm ci
      - name: Format
        run: cargo fmt --check
      - name: Shared wire vectors (the Swift copy matches contract-tests/wire-vectors.json)
        run: bash runtimes/swift/scripts/sync-vectors.sh --check
      - name: Device bench report (RESULTS.md's device tables are what the result files say; the blueprint targets match)
        run: node --test scripts/bench-device-report.test.mjs
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # `cargo test --workspace` above skips the heavy halves of these (they run real builds); here they
      # must run. The web app's build through the Vite plugin needs the npm registry; `undra upgrade`
      # end to end builds the core from a local clone. Gradle runs in the android job, Xcode in macos.
      - name: Build integrations (Vite plugin), undra upgrade end to end, the CI workflow, undra doctor
        run: UNDRA_REQUIRE_TOOLCHAINS=1 cargo test -p undra-cli --test build_systems --test upgrade --test ci_workflow --test doctor -- --skip xcode_builds --skip xcode_without --skip gradle_builds --skip gradle_without
      - name: The write rule in release (ADR-035; the audit's off-core writes were release-only)
        run: cargo test --release -p undra-runtime --test write_context -p undra-signals --test write_checker
      - name: Clippy (undra-ffi on wasm32)
        run: cargo clippy -p undra-ffi --target wasm32-unknown-unknown -- -D warnings
      - name: C ABI acceptance (undra.h with -Werror; the host contract under ASan)
        run: UNDRA_C_SANITIZE=1 bash crates/undra-ffi/tests/c/run.sh
      - name: Loaded cdylib keeps its schema + JNI exports (ADR-029 regression), and its docs equal the dev runner's
        run: cargo test -p undra-cli --test schema_retention --test schema_docs -- --ignored --nocapture
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: wasm32 build (core crates)
        run: |
          for p in undra-meta undra-wire undra-signals undra-runtime undra-ports undra-query undra-ffi undra playground-core; do
            cargo build -p $p --target wasm32-unknown-unknown
          done

  ts:
    name: TypeScript runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: runtimes/ts/@undra/runtime
        run: |
          npm ci
          npm test

  kotlin:
    name: Kotlin runtime (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc
        run: |
          curl -sSfL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Fetch kotlinx-coroutines
        run: |
          mkdir -p "$HOME/lib"
          curl -sSfLo "$HOME/lib/kotlinx-coroutines-core-jvm-1.6.4.jar" \
            https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.6.4/kotlinx-coroutines-core-jvm-1.6.4.jar
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the JNI library
        run: cargo build -p undra-ffi --features jni
      - name: Test (incl. JNI smoke against the real library)
        env:
          UNDRA_KOTLINX_COROUTINES: /home/runner/lib/kotlinx-coroutines-core-jvm-1.6.4.jar
          UNDRA_NATIVE_LIB_DIR: ${{ github.workspace }}/target/debug
          UNDRA_NATIVE_NAME: undra_ffi
        run: runtimes/kotlin/undra-runtime/scripts/test-local.sh

  wasm-ffi:
    name: wasm ABI (real module, TS runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the TypeScript runtime's dependencies
        working-directory: runtimes/ts/@undra/runtime
        run: npm ci
      # run.sh builds the TypeScript runtime from source into a scratch directory and fails (it does
      # not skip) when it cannot, so this leg can neither be stale nor silently absent.
      - name: wasm acceptance (raw host + TS runtime)
        run: bash crates/undra-ffi/tests/wasm/run.sh

  macos:
    name: Swift runtime + C ABI (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Swift tests
        working-directory: runtimes/swift/UndraRuntime
        run: swift test
      - name: Generated Swift compiles against the runtime (every golden case; ADR-024 amendment)
        run: UNDRA_REQUIRE_TOOLCHAINS=1 cargo test -p undra-bindgen --test typecheck_swift
      - name: Swift-over-C-ABI acceptance
        run: bash crates/undra-ffi/tests/swift/run.sh
      - name: C ABI acceptance (undra.h with -Werror; the host contract under ASan)
        run: UNDRA_C_SANITIZE=1 bash crates/undra-ffi/tests/c/run.sh
      - name: Loaded cdylib keeps its schema + JNI exports (ADR-029 regression, macOS dead-strip), and its docs equal the dev runner's
        run: cargo test -p undra-cli --test schema_retention --test schema_docs -- --ignored --nocapture
      - name: iOS cross-build (device + simulator)
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo check -p undra-ffi --target aarch64-apple-ios
          cargo check -p undra-ffi --target aarch64-apple-ios-sim
      - name: Xcode builds the core in its Run Script phase (undra init's project; Debug, Release, Debug)
        run: UNDRA_REQUIRE_TOOLCHAINS=1 cargo test -p undra-cli --test build_systems -- xcode --nocapture

  android:
    name: Android cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build the JNI library for both ABIs
        run: cargo ndk -t arm64-v8a -t x86_64 build -p undra-ffi --features jni
      # Gradle's undraBuild task over undra init's Android app (debug, release, debug again). It needs a
      # JDK 17, platform 35 and NDK r27 besides cargo-ndk; UNDRA_TEST_BUILD_SYSTEMS (not REQUIRE) runs it
      # when the runner image has them and prints why it skipped when it does not.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle builds the core in its undraBuild task
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          UNDRA_TEST_BUILD_SYSTEMS=1 cargo test -p undra-cli --test build_systems -- gradle --nocapture

  ffi-miri:
    # macOS, not Linux: Miri's strict c-variadic check currently flags parking_lot_core's
    # Linux futex call (upstream toolchain friction, not our code); the macOS backend has
    # no futex path and checks the same undra-ffi code.
    name: undra-ffi under Miri
    runs-on: macos-15
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Miri (unit tests; FFI-callback tests excluded)
        run: cargo +nightly miri test -p undra-ffi --lib
      - name: Miri (host-allocated port replies, out_reply is always free()d)
        run: |
          MIRIFLAGS="-Zmiri-disable-isolation" cargo +nightly miri test -p undra-ffi --test abi -- \
            a_host_that_sets_cap sync_port_answers

  ffi-asan:
    name: undra-ffi under ASan
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: AddressSanitizer (memory safety; host_contract is the port-callback lifetime regression)
        # The memory-safety targets only. `sync_alloc` asserts EXACT Rust allocation counts, which
        # ASan instrumentation perturbs (it is a performance-accounting test, not a safety one, and
        # runs unmodified in the normal Rust job).
        run: |
          RUSTFLAGS="-Z sanitizer=address" cargo +nightly test -p undra-ffi \
            --target x86_64-unknown-linux-gnu --lib --test abi --test host_contract

  contracts:
    name: Contract scenarios (TS + Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc
        run: |
          curl -sSfL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Fetch kotlinx-coroutines
        run: |
          mkdir -p "$HOME/lib"
          curl -sSfLo "$HOME/lib/kotlinx-coroutines-core-jvm-1.6.4.jar" \
            https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.6.4/kotlinx-coroutines-core-jvm-1.6.4.jar
      - name: Run the scenario runners
        env:
          UNDRA_KOTLINX_COROUTINES: /home/runner/lib/kotlinx-coroutines-core-jvm-1.6.4.jar
          # The Kotlin contract runner requires the stdlib path explicitly (it does not derive
          # it from the kotlinc location the way test-local.sh does).
          UNDRA_KOTLIN_STDLIB: /home/runner/kotlin/kotlinc/lib/kotlin-stdlib.jar
        run: bash contract-tests/run-all.sh ts kotlin

  contracts-swift:
    name: Contract scenarios (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Run the Swift scenario runner
        run: bash contract-tests/run-all.sh swift

  react-native:
    # The React Native runtime without a device (docs/REACT_NATIVE.md, "What is tested where"): the C++ host
    # against the real core under ASan + UBSan, the JSI layer compiled against React Native 0.87's own headers
    # with -Werror, the package's unit tests on a fake module, and the contract scenarios through
    # NativeTransport over a stand-in of the module on the wasm core. What only a device can show (JSI under
    # Hermes, both builds, the vsync sources) is .github/workflows/rn-devices.yml.
    name: React Native (host + model)
    # ubuntu-24.04, not -latest: the host's Rng is arc4random_buf, which glibc has had since 2.36 (24.04 ships 2.39).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            runtimes/rn/@undra/react-native/package-lock.json
            runtimes/ts/@undra/runtime/package-lock.json
            examples/playground/rn/package-lock.json
      # clang with its sanitizer runtime: the C++ test is built with clang++ (-fsanitize=address,undefined),
      # and the JSI check needs clang's view of React Native's headers. Pinned to 18, the release of 24.04.
      - name: clang 18 and its sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev
          # The runner's kernel randomises mmap with more bits than ASan's shadow layout accepted until
          # recently; 28 is what LLVM's own CI sets (runner-images issue 9491).
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: The undra CLI, then the playground core for this machine (the C++ test) and for the web (the contract column)
        run: |
          cargo build -p undra-cli
          target/debug/undra build -C examples/playground --platform host
          target/debug/undra build -C examples/playground --platform web
      # The package's build config (tsconfig.build.json) compiles against @undra/runtime's emitted declarations,
      # as an app that installs both sees them; dist/ is not committed.
      - name: The TypeScript runtime's declarations
        working-directory: runtimes/ts/@undra/runtime
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Package dependencies
        working-directory: runtimes/rn/@undra/react-native
        run: npm ci --no-audit --no-fund
      # The playground app is installed only for the React Native 0.87 headers that the JSI check compiles
      # against (run.sh fails, it does not skip, when they are missing: UNDRA_RN_REQUIRE_JSI).
      - name: React Native headers (the playground app's dependencies)
        working-directory: examples/playground/rn
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: C++ host under ASan + UBSan (both shims), and the JSI layer against React Native's headers
        env:
          CXX: clang++-18
          UNDRA_RN_REQUIRE_JSI: "1"
        run: runtimes/rn/@undra/react-native/cpp/test/run.sh
      - name: Unit tests (NativeTransport, frame scheduler, polyfills, loadNative)
        working-directory: runtimes/rn/@undra/react-native
        run: npm test
      - name: Typecheck (sources and the build config)
        working-directory: runtimes/rn/@undra/react-native
        run: npm run typecheck
      - name: Contract scenarios through NativeTransport (17 pass, S17 is app-tested)
        working-directory: runtimes/rn/@undra/react-native
        run: npm run test:contract
