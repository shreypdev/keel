name: Release

# One workflow behind a release (the runbook is docs/RELEASING.md; ADR-063: everything comes from this repository):
#
#   * push a tag v<version>                     -> build, package, then publish
#   * run it by hand with `publish` off         -> the same build and packaging, nothing published:
#                                                  a dry run whose results are workflow artifacts
#   * run it by hand on a v* tag with `publish` -> publish again (every publish step is idempotent,
#                                                  so this is also how a half-finished release is
#                                                  completed)
#
# Publishing is a GitHub Release: the CLI tarballs, the runtime tarballs and checksums.txt (the
# npm tarballs of @undra/runtime, @undra/testkit and @undra/react-native that projects depend on by
# URL). The tag itself is the rest: Cargo fetches the crates by it, SwiftPM reads the root
# Package.swift at it, and JitPack builds the Kotlin modules from it (jitpack.yml) the first time
# someone asks. The release needs no secret beyond the GITHUB_TOKEN GitHub gives every run: the
# build and package jobs only read, and the publish job is the only one with write access (to
# this repository's Releases).
#
# Third-party actions are pinned to commit SHAs (the comment names the version).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish for real (the GitHub Release). Off is a dry run. Needs a v* tag as the ref."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and every branch: the publish check below asks whether the tagged
          # commit is on the default branch.
          fetch-depth: 0
      - name: The tag, the workspace and every file that carries the version agree
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Cargo.toml, the three npm packages and every "@undra/runtime" range say one version (ADR-063).
          bash scripts/bump-version.sh --check
          version=$(awk '/^\[/ { section = $0 } section == "[workspace.package]" && /^version = "/ { gsub(/^version = "|"$/, ""); print; exit }' Cargo.toml)

          # A tag push publishes; a manual run publishes only when asked to.
          publish=false
          if [ "$EVENT" = push ] || [ "$PUBLISH_INPUT" = true ]; then
            publish=true
          fi

          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::The tag $REF_NAME does not match the workspace version $version (expected v$version). Fix the tag or run scripts/bump-version.sh."
              exit 1
            fi
          elif [ "$publish" = true ]; then
            echo "::error::Publishing needs the workflow to run on a version tag (v$version); this ref is $REF_NAME. Pick the tag under 'Use workflow from', or leave publish off for a dry run."
            exit 1
          fi

          # A release is cut from the merged commit on the default branch. A v* tag anywhere else
          # (a branch, a rewritten history) builds and packages like a dry run but publishes nothing.
          if [ "$publish" = true ] && ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::The tag $REF_NAME points at $(git rev-parse --short HEAD), which is not on $DEFAULT_BRANCH. Releases are tagged on the merged commit of $DEFAULT_BRANCH (docs/RELEASING.md); a dry run (publish off) runs from any ref."
            exit 1
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "Releasing **$version** (prerelease: $prerelease) from \`$REF_NAME\`." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run of **$version** from \`$REF_NAME\`: everything is built and packaged, nothing is published." >>"$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 is an Apple-silicon runner: the x86_64 build is a cross-compile with the
          # platform linker, which needs nothing beyond the rustup target.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          # Ubuntu 22.04 runners on purpose: a binary runs on any glibc at least as new as the one
          # it was linked against, so the oldest supported image sets the floor (2.35: Ubuntu 22.04,
          # Debian 12, RHEL 9 and their derivatives). The build job prints the actual floor.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # A native arm64 runner; no cross toolchain involved.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
      # `undra --version` prints this (first seven characters).
      UNDRA_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache on purpose: a release binary is built from the sources and the lock file
      # alone, never from artifacts a cache might hold.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: 1.99.0 # the version CI pins (ci.yml header); bump them together
          targets: ${{ matrix.target }}
      - name: Build (release profile, LTO, stripped)
        run: cargo build --release --locked -p undra-cli --target "$TARGET"
      - name: Check the binary
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/undra"
          ls -l "$bin"
          file "$bin"
          if [ "$TARGET" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::notice::Rosetta is not available on this runner: the x86_64 binary is built but not run."
            lipo -archs "$bin" | grep -qx x86_64
            exit 0
          fi
          run=("$bin")
          if [ "$TARGET" = x86_64-apple-darwin ]; then run=(arch -x86_64 "$bin"); fi
          out=$("${run[@]}" --version)
          expected="undra $VERSION (${GITHUB_SHA::7})"
          if [ "$out" != "$expected" ]; then
            echo "::error::'$bin --version' printed '$out', expected '$expected'"
            exit 1
          fi
          echo "$out"
          if [ "$RUNNER_OS" = Linux ]; then
            # The oldest glibc a machine needs to run this binary: the runner's, unless the build
            # avoids newer symbols.
            floor=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1 || true)
            echo "$TARGET needs ${floor:-no versioned glibc symbols}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pack undra-v${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz
        run: sh packaging/pack-release.sh --version "$VERSION" --target "$TARGET" --binary "target/$TARGET/release/undra" --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: undra-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package (checksums, the npm assets)
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: undra-*
          path: built
          merge-multiple: true
      - name: The CLI's tarballs
        run: |
          set -euo pipefail
          mkdir release
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            asset="undra-v$VERSION-$target.tar.gz"
            test -f "built/$asset" || { echo "::error::the build job produced no $asset"; exit 1; }
            cp "built/$asset" release/
            cat "built/$asset.sha256" >>release/checksums.txt
          done
      # ADR-063: projects depend on these by the release asset's URL. The build is `tsc` (and the runtime's rename pass,
      # ADR-057); `npm ci --ignore-scripts`, so no dependency's install script runs on a release build.
      - name: The npm packages (@undra/runtime, @undra/testkit, @undra/react-native)
        run: |
          set -euo pipefail
          bash packaging/pack-npm.sh --out npm
          for stem in undra-runtime undra-testkit undra-react-native; do
            cp "npm/$stem-$VERSION.tgz" release/
            (cd release && sha256sum "$stem-$VERSION.tgz") >>release/checksums.txt
          done
      - name: checksums.txt
        run: |
          set -euo pipefail
          (cd release && sha256sum --check --strict checksums.txt)
          {
            echo '### Release assets'
            echo '```'
            cat release/checksums.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      # What this proves, on the real artifacts and before anything is published: a project installs the three npm
      # tarballs by URL from a web server with no registry, every peer satisfied; the curl installer downloads,
      # verifies and installs the CLI's tarball from a local server.
      - name: Install the npm assets by URL, without a registry
        run: bash packaging/test-npm-assets.sh --release-dir release --version "$VERSION"
      - name: Run the curl installer against the release assets
        run: bash packaging/test-install.sh --release-dir release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish (the GitHub Release)
    needs: [verify, package]
    # Tag pushes, and manual runs with publish on; verify has already refused anything that is not
    # on a v<workspace version> tag. A dry run skips this whole job.
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # An environment is where publishing can be restricted to v* tags (docs/RELEASING.md,
    # hardening); it holds no secret, and until it is configured it changes nothing.
    environment: release
    permissions:
      contents: write # the GitHub Release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      TAG: v${{ needs.verify.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: The artifacts are the bytes the package job tested
        run: |
          set -euo pipefail
          # checksums.txt was written on the runners that built each CLI tarball and next to the npm
          # tarballs the package job installed, and verified by it.
          (cd release && sha256sum --check --strict checksums.txt)

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Releases are immutable: an existing one must hold exactly these assets.
            mkdir ../existing
            gh release download "$TAG" --pattern checksums.txt --dir ../existing
            if ! cmp -s ../existing/checksums.txt checksums.txt; then
              echo "::error::Release $TAG already exists with different assets. Releases are not overwritten: cut a patch version (docs/RELEASING.md, rollback)."
              exit 1
            fi
            echo "Release $TAG exists with these checksums; uploading whatever it lacks."
            have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for file in undra-v*.tar.gz undra-*.tgz checksums.txt; do
              if ! printf '%s\n' "$have" | grep -qx "$file"; then
                gh release upload "$TAG" "$file"
              fi
            done
          else
            flags=(--title "Undra $TAG" --generate-notes --verify-tag)
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" undra-v*.tar.gz undra-*.tgz checksums.txt "${flags[@]}"
          fi
