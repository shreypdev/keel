name: Site

# Builds the static site in `site/` and the real web playground (the Rust core as wasm plus the React
# app), stages both into `_site/`, checks them, and publishes them to GitHub Pages
# (https://shreypdev.github.io/undra/). Pull requests run the same build and checks without deploying.
# How it all fits together, and what the founder does by hand: docs/SITE.md.
#
# One-time repository setting: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/playground/**"
      - "examples/cookbook/**"
      - "examples/fieldbook/**"
      - "runtimes/ts/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bench/results/**"
      - "contract-tests/scenarios.md"
      - "README.md"
      - ".github/workflows/site.yml"
  # Pull requests and the merge queue run this through the Gate workflow (.github/workflows/gate.yml), which calls it
  # and ends in the one required check; it runs by itself only on main.
  workflow_call:

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# `id-token: write` is what deploy-pages needs to prove the deployment's origin (OIDC);
# it grants no write access to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish; a newer push waits its turn instead of cancelling it.
# Pull request builds and the builds of a piece's branch (`wt/<slug>`: a piece lands only on a green run of its exact head,
# docs/AGENT_WORKFLOW.md) are disposable and cancel their predecessors; neither ever deploys.
concurrency:
  group: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/wt/')) && format('site-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/wt/') }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/playground/web/package-lock.json
      # wasm-opt: `undra build` runs it over the core when it is installed.
      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # 1. The playground: one Rust core, compiled to wasm, under a React UI.
      - name: Build the playground core (wasm32)
        run: cargo run -p undra-cli -- build --platform web -C examples/playground
      # The playground imports the runtime from the workspace, and the runtime's Db worker imports its optional peer
      # wa-sqlite. The app declares wa-sqlite and its Vite config resolves it (and react) to the app's own copies, so
      # the build does not depend on this install; it is kept because it costs seconds and the runtime's sources are
      # what the build reads.
      - name: Install the TypeScript runtime's dependencies
        working-directory: runtimes/ts/@undra/runtime
        run: npm ci
      - name: Build the playground web app
        working-directory: examples/playground/web
        run: |
          npm ci
          npx vite build --base=/undra/playground/

      # 1b. The Rust API reference: rustdoc for the `undra` crate and the crates it re-exports,
      #     with warnings as errors, so a pub item without docs or a broken link fails here (R4).
      #     Not committed: stage.sh publishes target/doc at /reference/rust/.
      - name: Build the Rust API reference (rustdoc)
        run: bash site/scripts/build-rustdoc.sh

      # 2. The site's generated files (benchmark table, roadmap, error codes, blog index, feed,
      #    sitemap, search index, llms.txt, and the Swift, Kotlin and TypeScript API reference pages
      #    built from examples/playground/generated) must be what is committed. If this fails, run
      #    `node site/scripts/build-all.mjs` locally and commit the result. The measured numbers in
      #    README.md come from the same records (bench/results/web-size.jsonl, ADR-052), so it is
      #    checked with them.
      - name: Site script tests
        run: node --test site/scripts/decls.test.mjs
      - name: Generated files are up to date
        run: |
          node site/scripts/build-all.mjs
          if [ -n "$(git status --porcelain site/ README.md)" ]; then
            git --no-pager diff --stat site/ README.md
            echo "::error::site/ or README.md is stale. Run 'node site/scripts/build-all.mjs' and commit the result."
            exit 1
          fi

      # 3. Stage and check: every internal link and fragment resolves, every page has its title,
      #    description, canonical, Open Graph card and JSON-LD, and the shared header and footer match.
      #    The staged site holds the playground and the Rust reference too.
      - name: Check the source tree
        run: node site/scripts/check-links.mjs
      - name: Stage _site/ (site, playground, Rust reference)
        run: bash site/scripts/stage.sh
      - name: Check the staged site
        run: node site/scripts/check-links.mjs --root _site

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex and DuckDuckGo about the pages (IndexNow). Google discovers the sitemap
      # through Search Console, a one-time founder action described in docs/SITE.md. A failure here
      # never fails the deployment.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Submit the sitemap's URLs to IndexNow
        continue-on-error: true
        run: node site/scripts/indexnow.mjs

  # This workflow's own roll-up: green only when the build and its checks (the deploy runs on main only) succeeded (a failed, cancelled or skipped job fails it;
  # `if: always()` so it reports after failures too). The Gate workflow needs it for every workflow it calls, and
  # ends in the one check the ruleset requires. Named "Complete" so that only the Gate's last job is called "All green".
  complete:
    name: Complete
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
